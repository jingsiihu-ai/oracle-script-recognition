<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Oracle script recognition research pipeline</title>
  <desc id="desc">A multi-stage computer vision diagram showing synthetic rubbing-style input, robust preprocessing, learned detector adaptation, class-aware non-maximum suppression, glyph crop normalization, recognition, translation, and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFBEB"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78350F"/><stop offset="1" stop-color="#1C1917"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DC2626"/><stop offset="1" stop-color="#9F1239"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#292524" flood-opacity="0.11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#78716C"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#1C1917}.subtitle{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#57534E}
      .h{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#1C1917}.label{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#44403C}
      .small{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#78716C}.eq{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7F1D1D}
      .card{fill:#FFFFFF;stroke:#D6D3D1;stroke-width:1.5;rx:20;filter:url(#shadow)}.soft{fill:#FAFAF9;stroke:#D6D3D1;stroke-width:1.2;rx:12}
      .arrow{fill:none;stroke:#78716C;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="65" y="64" class="title">Oracle Script Recognition &amp; Translation</text>
  <text x="65" y="94" class="subtitle">Detector-agnostic vision pipeline with explicit preprocessing, post-processing, recognition and evaluation boundaries</text>
  <g transform="translate(1110,38)"><rect width="220" height="40" rx="20" fill="#FEF3C7"/><text x="110" y="25" text-anchor="middle" class="label" fill="#92400E">detection · OCR · heritage AI</text></g>

  <!-- Input -->
  <g transform="translate(45,145)">
    <rect class="card" width="250" height="390"/>
    <circle cx="31" cy="34" r="17" fill="#FEF3C7"/><text x="31" y="40" text-anchor="middle" class="label" fill="#92400E">1</text>
    <text x="62" y="40" class="h">Rubbing-style input</text>
    <g transform="translate(25,72)">
      <rect width="200" height="238" rx="12" fill="#E7E5E4" stroke="#A8A29E"/>
      <g fill="#A8A29E" opacity=".55"><circle cx="18" cy="24" r="3"/><circle cx="52" cy="18" r="2"/><circle cx="172" cy="31" r="4"/><circle cx="110" cy="46" r="3"/><circle cx="40" cy="108" r="4"/><circle cx="183" cy="121" r="3"/><circle cx="90" cy="192" r="4"/><circle cx="160" cy="211" r="2"/><path d="M8 72L44 59M136 76L191 63M11 164L53 147M129 180L190 169" stroke="#A8A29E" stroke-width="3"/></g>
      <g fill="none" stroke="url(#ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M42 46 L64 75 L40 106 M64 75 L91 49 M64 75 L92 104"/>
        <path d="M130 43 L130 113 M108 70 L153 70 M111 45 L151 110"/>
        <path d="M45 144 Q68 124 91 144 L86 201 Q68 219 49 199 Z M68 139V207"/>
        <path d="M123 143 L161 143 L142 168 L165 199 L119 199 M142 168V214"/>
      </g>
    </g>
    <text x="25" y="337" class="small">noise · uneven contrast · touching glyphs</text>
    <rect x="25" y="352" width="200" height="24" rx="8" fill="#FFF7ED"/><text x="125" y="369" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="10" font-weight="600" fill="#9A3412">synthetic glyphs · no restricted scan</text>
  </g>

  <!-- Preprocess -->
  <g transform="translate(335,145)">
    <rect class="card" width="250" height="390"/>
    <circle cx="31" cy="34" r="17" fill="#DBEAFE"/><text x="31" y="40" text-anchor="middle" class="label" fill="#1D4ED8">2</text>
    <text x="62" y="40" class="h">Robust preprocessing</text>
    <g transform="translate(25,76)">
      <g><rect width="200" height="72" class="soft"/><text x="100" y="26" text-anchor="middle" class="label">percentile normalization</text><text x="100" y="50" text-anchor="middle" class="eq">I′ = clip((I − pₗ)/(pₕ − pₗ))</text></g>
      <g transform="translate(0,94)"><rect width="200" height="72" class="soft"/><text x="100" y="26" text-anchor="middle" class="label">Otsu binarization</text><g transform="translate(20,43)"><rect width="160" height="10" rx="5" fill="#E7E5E4"/><rect width="91" height="10" rx="5" fill="#292524"/><path d="M93 -5V19" stroke="#DC2626" stroke-width="3"/></g></g>
      <g transform="translate(0,188)"><rect width="200" height="105" rx="12" fill="#F5F5F4" stroke="#A8A29E"/><g transform="translate(18,10)" fill="none" stroke="#1C1917" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 17 L42 39 L21 67 M42 39 L65 18 M42 39 L66 67"/><path d="M105 16V72 M87 39H124 M89 18L123 70"/><path d="M25 87Q43 74 61 87"/><path d="M111 85H143L127 101"/></g></g>
      <text x="100" y="316" text-anchor="middle" class="small">normalized binary image</text>
    </g>
  </g>

  <!-- Detection -->
  <g transform="translate(625,145)">
    <rect class="card" width="285" height="390"/>
    <circle cx="31" cy="34" r="17" fill="#DCFCE7"/><text x="31" y="40" text-anchor="middle" class="label" fill="#15803D">3</text>
    <text x="62" y="40" class="h">Detection + NMS</text>
    <g transform="translate(25,74)">
      <rect width="235" height="56" rx="12" fill="#F0FDF4" stroke="#86EFAC"/><text x="117" y="23" text-anchor="middle" class="label">YOLO / Faster R-CNN adapter</text><text x="117" y="43" text-anchor="middle" class="small">boxes · scores · class labels</text>
      <g transform="translate(0,78)"><rect width="235" height="172" rx="12" fill="#F5F5F4" stroke="#A8A29E"/><g transform="translate(18,14)" fill="none" stroke="#1C1917" stroke-width="5" stroke-linecap="round"><path d="M25 20L48 47L25 77M48 47L73 22M48 47L72 78"/><path d="M133 18V83M112 48H156M113 21L154 80"/><path d="M27 109Q49 92 71 109L66 141H31Z"/><path d="M119 107H158L139 126L161 147H116"/></g><g fill="none" stroke-width="2.5"><rect x="27" y="21" width="74" height="78" stroke="#2563EB"/><rect x="128" y="21" width="76" height="80" stroke="#16A34A"/><rect x="25" y="110" width="79" height="51" stroke="#F97316"/><rect x="124" y="109" width="83" height="57" stroke="#DB2777"/><rect x="20" y="16" width="86" height="88" stroke="#94A3B8" stroke-dasharray="5 4"/></g></g>
      <text x="117" y="272" text-anchor="middle" class="eq">keep i if IoU(i,j) &lt; τ</text>
      <text x="117" y="293" text-anchor="middle" class="small">class-aware non-maximum suppression</text>
    </g>
  </g>

  <!-- Recognition -->
  <g transform="translate(950,145)">
    <rect class="card" width="405" height="390"/>
    <circle cx="31" cy="34" r="17" fill="#FCE7F3"/><text x="31" y="40" text-anchor="middle" class="label" fill="#BE185D">4</text>
    <text x="62" y="40" class="h">Crop normalization → recognition</text>
    <g transform="translate(25,76)">
      <text x="0" y="14" class="small">padded fixed-size glyph crops</text>
      <g transform="translate(0,27)">
        <g><rect width="62" height="62" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/><path d="M17 14L31 31L17 49M31 31L47 15M31 31L47 49" fill="none" stroke="#1C1917" stroke-width="5" stroke-linecap="round"/></g>
        <g transform="translate(78,0)"><rect width="62" height="62" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/><path d="M31 10V53M14 31H50M16 13L48 51" fill="none" stroke="#1C1917" stroke-width="5" stroke-linecap="round"/></g>
        <g transform="translate(156,0)"><rect width="62" height="62" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/><path d="M14 19Q31 8 48 19L44 49Q31 58 18 48ZM31 13V52" fill="none" stroke="#1C1917" stroke-width="5" stroke-linecap="round"/></g>
        <g transform="translate(234,0)"><rect width="62" height="62" rx="10" fill="#FAFAF9" stroke="#D6D3D1"/><path d="M12 16H50L31 31L52 49H10M31 31V57" fill="none" stroke="#1C1917" stroke-width="5" stroke-linecap="round"/></g>
      </g>
      <path class="arrow" d="M150 105V138"/>
      <rect x="42" y="145" width="275" height="69" rx="14" fill="#FFF1F2" stroke="#FDA4AF"/><text x="179" y="173" text-anchor="middle" class="label">prototype / CNN / ViT recognizer</text><text x="179" y="197" text-anchor="middle" class="eq">ŷ = argmax_c sim(f(crop), e_c)</text>
      <path class="arrow" d="M179 219V249"/>
      <g transform="translate(15,258)"><rect width="330" height="47" rx="12" fill="url(#red)"/><text x="165" y="20" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="white">ordered character sequence → translation</text><text x="165" y="38" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#FFE4E6">confidence + provenance retained per crop</text></g>
    </g>
  </g>
  <path class="arrow" d="M295 340H330"/><path class="arrow" d="M585 340H620"/><path class="arrow" d="M910 340H945"/>

  <!-- Evaluation -->
  <g transform="translate(125,585)">
    <rect class="card" width="1150" height="155"/>
    <text x="28" y="39" class="h">Evaluation protocol separates failure sources</text>
    <g transform="translate(28,64)"><rect width="245" height="60" class="soft"/><text x="122" y="24" text-anchor="middle" class="label">Detection</text><text x="122" y="45" text-anchor="middle" class="eq">AP@IoU · precision · recall</text></g>
    <g transform="translate(302,64)"><rect width="245" height="60" class="soft"/><text x="122" y="24" text-anchor="middle" class="label">Recognition on GT crops</text><text x="122" y="45" text-anchor="middle" class="eq">isolates classifier quality</text></g>
    <g transform="translate(576,64)"><rect width="245" height="60" class="soft"/><text x="122" y="24" text-anchor="middle" class="label">Recognition on predicted crops</text><text x="122" y="45" text-anchor="middle" class="eq">captures error propagation</text></g>
    <g transform="translate(850,64)"><rect width="272" height="60" rx="12" fill="#FFF7ED" stroke="#FDBA74"/><text x="136" y="24" text-anchor="middle" class="label">Long-tail reporting</text><text x="136" y="45" text-anchor="middle" class="eq">macro metrics + failure cases</text></g>
  </g>
  <text x="1350" y="793" text-anchor="end" class="small">Synthetic schematic — benchmark values intentionally omitted</text>
</svg>
